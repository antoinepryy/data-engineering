version: 2

sources:
  - name: raw
    description: "Tables source contenant les données brutes de production"
    database: analytics
    schema: raw
    
    tables:
      - name: customers
        description: "Données des clients"
        columns:
          - name: customer_id
            description: "Identifiant unique du client"
            tests:
              - unique
              - not_null
          - name: email
            description: "Email du client"
            tests:
              - unique
              - not_null
          - name: created_at
            description: "Date de création du compte client"
            
      - name: orders
        description: "Données des commandes"
        columns:
          - name: order_id
            description: "Identifiant unique de la commande"
            tests:
              - unique
              - not_null
          - name: customer_id
            description: "Référence au client"
            tests:
              - not_null
              - relationships:
                  to: source('raw', 'customers')
                  field: customer_id
          - name: status
            description: "Statut de la commande"
            tests:
              - accepted_values:
                  values: ['pending', 'processing', 'completed', 'cancelled', 'refunded']
                  
      - name: order_items
        description: "Lignes de commande"
        columns:
          - name: order_item_id
            description: "Identifiant unique de la ligne"
            tests:
              - unique
              - not_null
          - name: order_id
            description: "Référence à la commande"
            tests:
              - not_null
              - relationships:
                  to: source('raw', 'orders')
                  field: order_id
                  
      - name: products
        description: "Catalogue produits"
        columns:
          - name: product_id
            description: "Identifiant unique du produit"
            tests:
              - unique
              - not_null
          - name: price
            description: "Prix de vente du produit"
            tests:
              - not_null
              
      - name: payments
        description: "Données de paiement"
        columns:
          - name: payment_id
            description: "Identifiant unique du paiement"
            tests:
              - unique
              - not_null
          - name: status
            description: "Statut du paiement"
            tests:
              - accepted_values:
                  values: ['pending', 'completed', 'failed', 'refunded']
                  
      - name: web_events
        description: "Événements de navigation web"
        columns:
          - name: event_id
            description: "Identifiant unique de l'événement"
            tests:
              - unique
              - not_null
          - name: event_type
            description: "Type d'événement"
            tests:
              - accepted_values:
                  values: ['page_view', 'click', 'add_to_cart', 'checkout', 'search']
                  
      - name: marketing_campaigns
        description: "Campagnes marketing"
        columns:
          - name: campaign_id
            description: "Identifiant unique de la campagne"
            tests:
              - unique
              - not_null
          - name: channel
            description: "Canal marketing"
            tests:
              - accepted_values:
                  values: ['email', 'social_media', 'search', 'display', 'affiliate']
                  
      - name: marketing_attributions
        description: "Attribution des conversions aux campagnes"
        columns:
          - name: attribution_id
            description: "Identifiant unique de l'attribution"
            tests:
              - unique
              - not_null

models:
  - name: stg_customers
    description: "Staging des données clients avec nettoyage et standardisation"
    columns:
      - name: customer_id
        description: "Identifiant unique du client"
        tests:
          - unique
          - not_null
      - name: customer_email
        description: "Email normalisé du client"
        tests:
          - unique
          - not_null
      - name: customer_full_name
        description: "Nom complet du client"
      - name: customer_location
        description: "Localisation du client (ville, pays)"
      - name: is_valid_email
        description: "Indicateur de validité de l'email"
      - name: customer_created_at
        description: "Date de création du compte"
        
  - name: stg_orders
    description: "Staging des commandes avec enrichissement"
    columns:
      - name: order_id
        description: "Identifiant unique de la commande"
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Référence au client"
        tests:
          - not_null
      - name: order_date
        description: "Date de la commande"
        tests:
          - not_null
      - name: order_status
        description: "Statut normalisé de la commande"
      - name: is_completed
        description: "Indicateur de commande complétée"
      - name: is_cancelled
        description: "Indicateur de commande annulée"
      - name: days_since_order
        description: "Nombre de jours depuis la commande"
        
  - name: stg_order_items
    description: "Staging des lignes de commande avec calculs"
    columns:
      - name: order_item_id
        description: "Identifiant unique de la ligne"
        tests:
          - unique
          - not_null
      - name: order_id
        description: "Référence à la commande"
      - name: product_id
        description: "Référence au produit"
      - name: quantity
        description: "Quantité commandée"
        tests:
          - not_null
      - name: line_total
        description: "Montant total de la ligne"
      - name: margin
        description: "Marge sur la ligne"
        
  - name: stg_products
    description: "Staging des produits avec catégorisation"
    columns:
      - name: product_id
        description: "Identifiant unique du produit"
        tests:
          - unique
          - not_null
      - name: product_name
        description: "Nom du produit nettoyé"
      - name: product_category
        description: "Catégorie normalisée"
      - name: is_active
        description: "Indicateur de produit actif"
      - name: margin_rate
        description: "Taux de marge du produit"