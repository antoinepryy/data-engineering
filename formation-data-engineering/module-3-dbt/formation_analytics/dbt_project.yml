# Nom et version du projet DBT
name: 'formation_analytics'
version: '1.0.0'
config-version: 2

# Ce paramètre indique à DBT d'utiliser ces configurations
profile: 'formation_analytics'

# Configurations des chemins
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

# Répertoire de build
target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Configuration globale des modèles
models:
  formation_analytics:
    # Configuration par défaut
    +materialized: view
    +on_schema_change: "sync_all_columns"
    
    # Configuration par couche
    staging:
      +materialized: view
      +schema: staging
      +tags: ['staging', 'daily']
      +docs:
        show: true
    
    intermediate:
      +materialized: view
      +schema: intermediate
      +tags: ['intermediate', 'daily']
    
    marts:
      +materialized: table
      +schema: marts
      +tags: ['marts', 'production']
      core:
        +materialized: table
        +tags: ['core']
      
      finance:
        +materialized: table
        +tags: ['finance']
      
      marketing:
        +materialized: table
        +tags: ['marketing']
    
    examples:
      +materialized: view
      +schema: dev
      +enabled: true

# Configuration des snapshots
snapshots:
  formation_analytics:
    +target_schema: snapshots
    +strategy: timestamp
    +updated_at: updated_at

# Configuration des seeds
seeds:
  formation_analytics:
    +schema: seeds
    +quote_columns: false

# Variables du projet
vars:
  # Dates de début pour l'analyse
  start_date: '2024-01-01'
  
  # Seuils de qualité des données
  min_order_amount: 0
  max_order_amount: 100000
  
  # Configuration métier
  tax_rate: 0.20
  default_currency: 'EUR'
  
  # Feature flags
  enable_advanced_analytics: true
  enable_ml_features: false

# Configuration des tests
tests:
  formation_analytics:
    +severity: warn
    +error_if: ">10"
    +warn_if: ">0"

# Configuration de la documentation
docs:
  node_colors:
    staging: "#7B68EE"
    intermediate: "#FFD700"
    marts: "#32CD32"
    examples: "#FF6347"

# Configuration des logs
log:
  use_json: false
  level: info

# Packages DBT à installer
packages:
  - package: dbt-labs/dbt_utils
    version: 1.1.1
  - package: calogica/dbt_expectations
    version: 0.10.1