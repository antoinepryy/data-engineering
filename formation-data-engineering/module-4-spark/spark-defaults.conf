# Configuration Spark par défaut
# Module 4 - Formation Data Engineering

# Configuration générale
spark.app.name                      SparkFormation
spark.master                         spark://spark-master:7077
spark.submit.deployMode              client

# Mémoire et exécution
spark.driver.memory                  2g
spark.executor.memory                2g
spark.executor.cores                 2
spark.executor.instances             2
spark.default.parallelism            8
spark.sql.shuffle.partitions         200

# Configuration réseau
spark.driver.host                    spark-master
spark.driver.bindAddress             0.0.0.0
spark.blockManager.port              7078
spark.driver.port                    7079

# UI et History
spark.ui.enabled                     true
spark.ui.port                        4040
spark.history.ui.port                18080
spark.eventLog.enabled               true
spark.eventLog.dir                   file:///opt/spark-events
spark.history.fs.logDirectory        file:///opt/spark-events

# Sérialisation
spark.serializer                     org.apache.spark.serializer.KryoSerializer
spark.kryo.registrationRequired      false

# SQL et DataFrame
spark.sql.adaptive.enabled           true
spark.sql.adaptive.coalescePartitions.enabled true
spark.sql.adaptive.skewJoin.enabled  true
spark.sql.adaptive.localShuffleReader.enabled true
spark.sql.execution.arrow.pyspark.enabled true
spark.sql.warehouse.dir              /opt/spark-warehouse

# Optimisations
spark.sql.autoBroadcastJoinThreshold 10485760
spark.sql.broadcastTimeout          300
spark.sql.cbo.enabled                true
spark.sql.cbo.joinReorder.enabled    true

# Delta Lake
spark.sql.extensions                 io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog      org.apache.spark.sql.delta.catalog.DeltaCatalog

# Monitoring
spark.metrics.conf.*.sink.console.class org.apache.spark.metrics.sink.ConsoleSink
spark.metrics.conf.master.source.jvm.class org.apache.spark.metrics.source.JvmSource
spark.metrics.conf.executor.source.jvm.class org.apache.spark.metrics.source.JvmSource