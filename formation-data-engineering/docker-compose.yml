version: '3.8'

services:
  # ====================================
  # Module 1: Traitement Vocal
  # ====================================
  vocal-python:
    build:
      context: ./module-1-vocal
      dockerfile: Dockerfile.python
    container_name: vocal-python
    ports:
      - "8501:8501"  # Streamlit
      - "5000:5000"  # Flask API
    volumes:
      - ./module-1-vocal:/app
      - ./data:/data
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - formation-network
    stdin_open: true
    tty: true
    command: tail -f /dev/null

  vocal-node:
    build:
      context: ./module-1-vocal
      dockerfile: Dockerfile.node
    container_name: vocal-node
    ports:
      - "3000:3000"  # Express server
      - "3001:3001"  # WebSocket server
    volumes:
      - ./module-1-vocal:/app
      - ./data:/data
    networks:
      - formation-network
    stdin_open: true
    tty: true

  # ====================================
  # Module 2: Apache Airflow
  # ====================================
  postgres-airflow:
    image: postgres:13
    container_name: postgres-airflow
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-airflow-data:/var/lib/postgresql/data
    networks:
      - formation-network

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - formation-network

  airflow-init:
    build:
      context: ./module-2-airflow
      dockerfile: Dockerfile
    container_name: airflow-init
    depends_on:
      - postgres-airflow
      - redis
    environment:
      - AIRFLOW__CORE__EXECUTOR=CeleryExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres-airflow/airflow
      - AIRFLOW__CELERY__BROKER_URL=redis://redis:6379/0
      - AIRFLOW__CELERY__RESULT_BACKEND=db+postgresql://airflow:airflow@postgres-airflow/airflow
      - AIRFLOW__CORE__FERNET_KEY=46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLbfzqDDho=
      - AIRFLOW__WEBSERVER__SECRET_KEY=secret
      - _AIRFLOW_DB_MIGRATE=true
      - _AIRFLOW_WWW_USER_CREATE=true
      - _AIRFLOW_WWW_USER_USERNAME=admin
      - _AIRFLOW_WWW_USER_PASSWORD=admin
    entrypoint: /bin/bash
    command: -c "airflow db migrate && airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true"
    networks:
      - formation-network

  airflow-webserver:
    build:
      context: ./module-2-airflow
      dockerfile: Dockerfile
    container_name: airflow-webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      - AIRFLOW__CORE__EXECUTOR=CeleryExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres-airflow/airflow
      - AIRFLOW__CELERY__BROKER_URL=redis://redis:6379/0
      - AIRFLOW__CELERY__RESULT_BACKEND=db+postgresql://airflow:airflow@postgres-airflow/airflow
      - AIRFLOW__CORE__FERNET_KEY=46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLbfzqDDho=
      - AIRFLOW__WEBSERVER__SECRET_KEY=secret
    ports:
      - "8080:8080"
    volumes:
      - ./module-2-airflow/dags:/opt/airflow/dags
      - ./module-2-airflow/logs:/opt/airflow/logs
      - ./module-2-airflow/plugins:/opt/airflow/plugins
      - ./data:/data
    command: webserver
    networks:
      - formation-network

  airflow-scheduler:
    build:
      context: ./module-2-airflow
      dockerfile: Dockerfile
    container_name: airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      - AIRFLOW__CORE__EXECUTOR=CeleryExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres-airflow/airflow
      - AIRFLOW__CELERY__BROKER_URL=redis://redis:6379/0
      - AIRFLOW__CELERY__RESULT_BACKEND=db+postgresql://airflow:airflow@postgres-airflow/airflow
      - AIRFLOW__CORE__FERNET_KEY=46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLbfzqDDho=
      - AIRFLOW__WEBSERVER__SECRET_KEY=secret
    volumes:
      - ./module-2-airflow/dags:/opt/airflow/dags
      - ./module-2-airflow/logs:/opt/airflow/logs
      - ./module-2-airflow/plugins:/opt/airflow/plugins
      - ./data:/data
    command: scheduler
    networks:
      - formation-network

  airflow-worker:
    build:
      context: ./module-2-airflow
      dockerfile: Dockerfile
    container_name: airflow-worker
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      - AIRFLOW__CORE__EXECUTOR=CeleryExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres-airflow/airflow
      - AIRFLOW__CELERY__BROKER_URL=redis://redis:6379/0
      - AIRFLOW__CELERY__RESULT_BACKEND=db+postgresql://airflow:airflow@postgres-airflow/airflow
      - AIRFLOW__CORE__FERNET_KEY=46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLbfzqDDho=
      - AIRFLOW__WEBSERVER__SECRET_KEY=secret
    volumes:
      - ./module-2-airflow/dags:/opt/airflow/dags
      - ./module-2-airflow/logs:/opt/airflow/logs
      - ./module-2-airflow/plugins:/opt/airflow/plugins
      - ./data:/data
    command: celery worker
    networks:
      - formation-network

  # ====================================
  # Module 3: DBT
  # ====================================
  postgres-dbt:
    image: postgres:13
    container_name: postgres-dbt
    environment:
      POSTGRES_USER: dbt_user
      POSTGRES_PASSWORD: dbt_pass
      POSTGRES_DB: analytics
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "5433:5432"
    volumes:
      - postgres-dbt-data:/var/lib/postgresql/data
      - ./module-3-dbt/init-scripts:/docker-entrypoint-initdb.d
    networks:
      - formation-network

  dbt:
    build:
      context: ./module-3-dbt
      dockerfile: Dockerfile
    container_name: dbt
    depends_on:
      - postgres-dbt
    volumes:
      - ./module-3-dbt:/usr/app
      - ./data:/data
    environment:
      - DBT_PROFILES_DIR=/usr/app
    networks:
      - formation-network
    stdin_open: true
    tty: true
    command: tail -f /dev/null

  # ====================================
  # Module 4: Apache Spark
  # ====================================
  spark-master:
    build:
      context: ./module-4-spark
      dockerfile: Dockerfile
    container_name: spark-master
    ports:
      - "9090:8080"  # Spark UI
      - "7077:7077"  # Spark Master
      - "8888:8888"  # Jupyter
      - "4040:4040"  # Spark Application UI
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    volumes:
      - ./module-4-spark:/opt/spark-apps
      - ./data:/data
    networks:
      - formation-network

  spark-worker-1:
    build:
      context: ./module-4-spark
      dockerfile: Dockerfile
    container_name: spark-worker-1
    depends_on:
      - spark-master
    ports:
      - "9091:8081"
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2g
      - SPARK_WORKER_CORES=2
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    volumes:
      - ./module-4-spark:/opt/spark-apps
      - ./data:/data
    networks:
      - formation-network

  spark-worker-2:
    build:
      context: ./module-4-spark
      dockerfile: Dockerfile
    container_name: spark-worker-2
    depends_on:
      - spark-master
    ports:
      - "9092:8081"
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2g
      - SPARK_WORKER_CORES=2
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    volumes:
      - ./module-4-spark:/opt/spark-apps
      - ./data:/data
    networks:
      - formation-network

  # ====================================
  # Services Communs
  # ====================================
  jupyter:
    image: jupyter/pyspark-notebook:spark-3.5.0
    container_name: jupyter
    ports:
      - "8889:8888"
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - JUPYTER_TOKEN=formation2024
    volumes:
      - ./notebooks:/home/jovyan/work
      - ./data:/home/jovyan/data
    networks:
      - formation-network

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data
    networks:
      - formation-network

networks:
  formation-network:
    driver: bridge

volumes:
  postgres-airflow-data:
  postgres-dbt-data:
  portainer-data: